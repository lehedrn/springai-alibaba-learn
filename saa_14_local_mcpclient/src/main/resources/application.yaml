server:
  port: 18080
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

spring:
  application:
    name: saa_14_local_mcpclient
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API}
    mcp:
      client:
        type: async
        request-timeout: 60s
        toolcallback:
          enabled: true
        sse:
          connections:
            server-1:
              url: http://localhost:18081